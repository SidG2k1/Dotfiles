# Starship config — two-line prompt: cwd, git branch/state, duration.

command_timeout = 2000
add_newline = false

format = """
$directory\
$git_branch\
$git_status\
$git_state\
$cmd_duration\
$line_break\
$character"""

[character]
success_symbol = "[❯](bold cyan)"
error_symbol   = "[❯](bold red)"
vimcmd_symbol  = "[❮](bold green)"

[directory]
# 0 = no left-truncation, so the full path is shown from ~ down.
# (3 clipped to the last 3 components: ~/a/b/c/d rendered as "b/c/d".)
truncation_length = 0
# Inside a git repo, start the path at the repo root instead of at ~.
truncate_to_repo  = true
style             = "blue"

[git_branch]
style  = "yellow"
format = '[\($branch\)]($style) '

[git_status]
style = "yellow"

[cmd_duration]
min_time = 2000
style    = "yellow"
format   = '[⏱ $duration]($style) '
