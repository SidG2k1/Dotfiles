# Starship config — two-line prompt: cwd, Kubernetes target, git branch/state, duration.

command_timeout = 2000
add_newline = false

format = """
$directory\
${custom.kubernetes}\
$git_branch\
$git_status\
$git_state\
$cmd_duration\
$line_break\
$character"""

[character]
success_symbol = "[❯](bold cyan)"
error_symbol   = "[❯](bold red)"
vimcmd_symbol  = "[❮](bold green)"

[directory]
# 0 = no left-truncation, so the full path is shown from ~ down.
# (3 clipped to the last 3 components: ~/a/b/c/d rendered as "b/c/d".)
truncation_length = 0
# Inside a git repo, start the path at the repo root instead of at ~.
truncate_to_repo  = true
style             = "blue"

[custom.kubernetes]
# Starship's native module leaves an unset namespace blank even though Kubernetes uses "default".
command = '''
value=$(kubectl config view --minify --output 'jsonpath={.contexts[0].context.cluster}/{.contexts[0].context.namespace}' 2>/dev/null) || exit 1
[ -n "$value" ] || exit 1
case "$value" in */) value="${value}default";; esac
printf '%s' "$value"
'''
when   = 'command -v kubectl >/dev/null 2>&1'
symbol = "☸ "
style  = "cyan"
format = '[$symbol$output]($style) '

[git_branch]
style  = "yellow"
format = '[\($branch\)]($style) '

[git_status]
style = "yellow"

[cmd_duration]
min_time = 2000
style    = "yellow"
format   = '[⏱ $duration]($style) '
