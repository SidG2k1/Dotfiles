# Portable preferences only. Codex-managed paths, project trust, authentication,
# local browser hashes, and machine-specific MCP servers are intentionally omitted.
# No model pin: a specific model id is account- and rollout-specific, the same
# class of machine-specific assumption removed from agents/AGENTS.md. Set one
# per machine in ~/.codex/config.toml after this base is copied.
model_reasoning_effort = "high"
approvals_reviewer = "auto_review"
plan_mode_reasoning_effort = "xhigh"
service_tier = "priority"

[plugins."documents@openai-primary-runtime"]
enabled = true

[plugins."pdf@openai-primary-runtime"]
enabled = true

[plugins."spreadsheets@openai-primary-runtime"]
enabled = true

[plugins."presentations@openai-primary-runtime"]
enabled = true

[plugins."template-creator@openai-primary-runtime"]
enabled = true

[plugins."chrome@openai-bundled"]
enabled = true

[plugins."sites@openai-bundled"]
enabled = true

[plugins."visualize@openai-bundled"]
enabled = true

[plugins."superpowers@openai-curated-remote"]
enabled = false

[plugins."browser@openai-bundled"]
enabled = true

[features]
js_repl = false

[mcp_servers.openaiDeveloperDocs]
url = "https://developers.openai.com/mcp"

[desktop]
conversationDetailMode = "STEPS_COMMANDS"
ambient-suggestions-enabled = true
followUpQueueMode = "steer"
dock-icon-preference = "app-default"
show-context-window-usage = true

[desktop.open-in-target-preferences]
global = "ghostty"

[tui]
status_line = ["model-with-reasoning", "current-dir", "project-name", "git-branch", "pull-request-number", "run-state", "approval-mode", "context-used"]
status_line_use_colors = true
vim_mode_default = true
